name: Weekly rankings

# Rebuilds the top-10 lists from the brokers' public data and commits the result.
# Monday 06:00 UTC — after the weekend gap, before the London session.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# contents: write to push the rebuilt files; pages/id-token for the deploy job,
# which cannot hold more permission than this caller grants it.
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # fetch-rankings exits non-zero if BOTH sources fail, which fails the job
      # rather than publishing an empty board.
      - name: Fetch rankings
        run: node scripts/fetch-rankings.mjs

      - name: Build site
        run: node scripts/build-site.mjs

      - name: Commit if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rankings.json index.html rankings/ methodology/ partners/ sitemap.xml
          if git diff --staged --quiet; then
            echo "No ranking changes this week."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Weekly rankings: $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # The push above uses the default GITHUB_TOKEN, so it will NOT trigger
  # deploy-pages.yml's `push` event. Call the deploy explicitly instead.
  deploy:
    needs: rebuild
    if: needs.rebuild.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-pages.yml
